<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放控件</title>
    <link rel="stylesheet" href="../../@lib/symbols/round/index.css">
    <style>
        :root {
            --accent-hue: 205;
            --accent: hsl(var(--accent-hue), 88%, 66%);
            --accent-strong: hsl(var(--accent-hue), 84%, 57%);
            --text: #f4f7fb;
            --text-muted: #9ba9bb;
            --text-dim: #8a99ac;
            --surface: rgba(16, 23, 35, 0.98);
            --surface-raised: rgba(28, 39, 56, 0.96);
            --surface-soft: rgba(255, 255, 255, 0.065);
            --border: rgba(255, 255, 255, 0.13);
            --shadow: rgba(3, 8, 18, 0.52);
            --track: rgba(255, 255, 255, 0.13);
            --cover-fallback: #26354a;
            --progress-angle: 0deg;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-app-region: no-drag;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            color: var(--text);
            background: transparent;
            font-family: "Segoe UI Variable", "Aptos", "Microsoft YaHei UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-app-region: drag;
        }

        body:not(.dark) {
            --text: #1b2736;
            --text-muted: #607086;
            --text-dim: #8391a3;
            --surface: rgba(247, 249, 252, 0.98);
            --surface-raised: rgba(255, 255, 255, 0.96);
            --surface-soft: rgba(22, 44, 72, 0.065);
            --border: rgba(40, 62, 88, 0.15);
            --shadow: rgba(36, 52, 72, 0.25);
            --track: rgba(30, 55, 84, 0.13);
            --cover-fallback: #dbe4ef;
        }

        button {
            appearance: none;
            border: 0;
            color: inherit;
            font: inherit;
        }

        [hidden] { display: none !important; }

        .play-widget:focus { outline: none; }
        .play-widget:focus-visible .play-control { border-color: var(--accent); }

        .text-action {
            padding: 3px 5px;
            border-radius: 5px;
            color: var(--accent);
            background: transparent;
            font-size: 11px;
            cursor: pointer;
        }

        .text-action:focus-visible { outline: 1px solid var(--accent); }
        button[aria-disabled="true"] { opacity: 0.55; cursor: wait; }

        .play-widget {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            padding: 7px 8px 6px;
            -webkit-app-region: drag;
        }

        .play-control {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            height: 100%;
            min-width: 0;
            overflow: hidden;
            padding: 8px 14px 4px 16px;
            border: 1px solid var(--border);
            border-radius: 19px;
            background:
                radial-gradient(circle at 8% 0%, hsla(var(--accent-hue), 90%, 70%, 0.18), transparent 35%),
                linear-gradient(145deg, var(--surface-raised), var(--surface));
            box-shadow: 0 8px 22px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: border-color 220ms ease, box-shadow 220ms ease;
            -webkit-app-region: drag;
        }

        body.is-hovered .play-control,
        body.is-playlist-open .play-control {
            border-color: hsla(var(--accent-hue), 75%, 68%, 0.3);
            box-shadow: 0 14px 34px var(--shadow), 0 0 0 1px hsla(var(--accent-hue), 80%, 68%, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .play-control::after {
            position: absolute;
            right: 17px;
            bottom: 7px;
            left: 17px;
            height: 1px;
            content: "";
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            pointer-events: none;
        }

        .topline {
            position: relative;
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            flex: 1;
            min-height: 82px;
        }

        .is-content-open .topline {
            flex: 0 0 94px;
        }

        .cover {
            position: relative;
            width: 64px;
            height: 64px;
            overflow: hidden;
            flex: 0 0 auto;
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: conic-gradient(from -38deg, var(--accent) var(--progress-angle), var(--track) var(--progress-angle));
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28), 0 0 0 1px hsla(var(--accent-hue), 85%, 68%, 0.12);
            -webkit-app-region: drag;
        }

        .cover.is-playing {
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28), 0 0 0 1px hsla(var(--accent-hue), 85%, 68%, 0.2);
        }

        .cover::before {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            width: 7px;
            height: 7px;
            content: "";
            border: 2px solid rgba(255, 255, 255, 0.88);
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            transform: translate(-50%, -50%);
        }

        .cover::after {
            position: absolute;
            inset: 7px;
            content: "";
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0 3px, rgba(255, 255, 255, 0.07) 3.5px 4px);
            opacity: 0.62;
            pointer-events: none;
        }

        .cover img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: var(--cover-fallback);
            animation: cover-spin 18s linear infinite paused;
            -webkit-app-region: drag;
        }

        .cover.is-playing img {
            animation-play-state: running;
        }

        .cover-sheen {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.26), transparent 44%);
            pointer-events: none;
            -webkit-app-region: drag;
        }

        .cover.is-playing .cover-sheen {
            animation: sheen-breathe 4.2s ease-in-out infinite;
        }

        .track-info {
            position: relative;
            height: 100%;
            min-width: 0;
            overflow: hidden;
        }

        .track-details {
            position: absolute;
            inset: 0 0 43px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(3px);
            transition: opacity 160ms ease, transform 180ms ease, visibility 0s linear 180ms;
        }

        .track-caption {
            display: flex;
            gap: 8px;
            min-width: 0;
        }

        .track-caption > * { min-width: 0; }

        .track-kicker {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.06em;
            line-height: 1;
        }

        .state-dot {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            box-shadow: 0 0 0 3px hsla(var(--accent-hue), 80%, 65%, 0.1);
        }

        .state-dot::after {
            position: absolute;
            inset: -2px;
            content: "";
            border: 1px solid rgba(125, 226, 168, 0.72);
            border-radius: inherit;
            opacity: 0;
            pointer-events: none;
        }

        .state-dot.is-playing {
            background: #7de2a8;
            box-shadow: 0 0 0 2px rgba(125, 226, 168, 0.1);
        }

        .state-dot.is-playing::after {
            animation: none;
        }

        .rhythm-bars {
            display: inline-flex;
            align-items: end;
            gap: 2px;
            height: 10px;
            margin-left: auto;
            opacity: 0.7;
        }

        .rhythm-bars i {
            display: block;
            width: 2px;
            height: 4px;
            border-radius: 99px;
            background: var(--accent);
            transform-origin: bottom;
        }

        .rhythm-bars i:nth-child(2) { height: 8px; }
        .rhythm-bars i:nth-child(3) { height: 6px; }
        .rhythm-bars i:nth-child(4) { height: 9px; }

        .rhythm-bars.is-playing i {
            animation: rhythm 760ms ease-in-out infinite alternate;
        }

        .rhythm-bars.is-playing i:nth-child(2) { animation-delay: -180ms; }
        .rhythm-bars.is-playing i:nth-child(3) { animation-delay: -340ms; }
        .rhythm-bars.is-playing i:nth-child(4) { animation-delay: -520ms; }

        .track-name,
        .track-artist,
        .track-album {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .idle-lyric-text {
            flex: 1;
            min-width: 0;
            display: -webkit-box;
            overflow: hidden;
            white-space: normal;
            overflow-wrap: anywhere;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
        }

        .idle-lyric-text.is-refreshing {
            animation: lyric-arrive 240ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
        }

        .track-name {
            color: var(--text);
            font-size: 15px;
            font-weight: 650;
            letter-spacing: 0.01em;
            line-height: 1.25;
        }

        .track-artist {
            margin-top: 0;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 400;
            line-height: 1.2;
        }

        .track-album {
            padding-left: 8px;
            border-left: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 11px;
            line-height: 1.2;
        }

        .idle-lyric {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-width: 0;
            color: var(--accent);
            font-size: 17px;
            font-weight: 650;
            line-height: 1.5;
            transition: opacity 160ms ease, visibility 0s linear 180ms;
        }

        .idle-lyric .icon-round {
            flex: 0 0 auto;
            font-size: 13px;
            opacity: 0.85;
        }

        .is-hovered .track-details {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .is-hovered .idle-lyric {
            opacity: 0;
            visibility: hidden;
        }

        .control {
            position: absolute;
            bottom: 0;
            left: 76px;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            height: 38px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(4px);
            transition: opacity 190ms ease, transform 220ms cubic-bezier(0.2, 0.75, 0.25, 1), visibility 0s linear 220ms;
            -webkit-app-region: no-drag;
        }

        .is-hovered .control {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translate(0, 0);
            transition-delay: 0s;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
            border-radius: 10px;
            color: var(--text-muted);
            background: transparent;
            cursor: pointer;
            outline: none;
            transition: color 160ms ease, background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
            -webkit-app-region: no-drag;
        }

        .icon-button:hover {
            color: var(--text);
            background: var(--surface-soft);
        }

        .icon-button:focus-visible {
            box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px hsla(var(--accent-hue), 90%, 65%, 0.7);
        }

        .icon-button:active {
            transform: scale(0.9);
        }

        .icon-button.is-active {
            color: var(--accent);
            background: hsla(var(--accent-hue), 80%, 62%, 0.14);
        }

        .icon-button-primary {
            position: relative;
            width: 36px;
            height: 36px;
            color: #07111d;
            border-radius: 12px;
            background: var(--accent);
            box-shadow: 0 3px 10px hsla(var(--accent-hue), 85%, 56%, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.32);
        }

        .icon-button-primary:hover {
            color: #07111d;
            background: hsl(var(--accent-hue), 92%, 73%);
            box-shadow: 0 7px 18px hsla(var(--accent-hue), 85%, 56%, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .is-playing .icon-button-primary::after {
            position: absolute;
            inset: -4px;
            content: "";
            border: 1px solid hsla(var(--accent-hue), 90%, 72%, 0.62);
            border-radius: 15px;
            opacity: 0.2;
            pointer-events: none;
        }

        .fa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: "Material Symbols Round";
            font-size: 18px;
            font-style: normal;
            font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
            line-height: 1;
        }

        .icon-button-primary .fa {
            font-size: 21px;
        }

        .fa-play::after { content: "\e037"; }
        .fa-pause::after { content: "\e034"; }
        .fa-step-backward::after { content: "\e045"; }
        .fa-step-forward::after { content: "\e044"; }
        .fa-queue::after { content: "\e03d"; }
        .fa-expand::after { content: "\f830"; }
        .fa-collapse::after { content: "\f507"; }

        .playlist-panel {
            display: none;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            flex-direction: column;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface-soft);
            -webkit-app-region: no-drag;
        }

        .is-playlist-open .playlist-panel {
            display: flex;
            animation: panel-in 180ms ease both;
        }

        .playlist-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 0 0 36px;
            gap: 8px;
            padding: 0 4px 0 11px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.06em;
        }

        .playlist-head strong {
            color: var(--text);
            font-size: 12px;
            letter-spacing: 0.08em;
        }

        .playlist-count {
            margin-right: auto;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .playlist-list {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 3px 4px 4px;
            scrollbar-color: hsla(var(--accent-hue), 75%, 63%, 0.55) transparent;
            scrollbar-width: thin;
        }

        .playlist-item {
            display: grid;
            grid-template-columns: 20px 30px minmax(0, 1fr) auto;
            align-items: center;
            gap: 7px;
            width: 100%;
            min-height: 44px;
            padding: 4px 6px;
            border-radius: 9px;
            color: var(--text-muted);
            background: transparent;
            cursor: pointer;
            text-align: left;
            transition: background-color 150ms ease, color 150ms ease, transform 150ms ease;
            -webkit-app-region: no-drag;
        }

        .playlist-item:hover,
        .playlist-item:focus-visible {
            color: var(--text);
            background: var(--surface-soft);
        }

        .playlist-item:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: -2px;
        }

        .playlist-item:active {
            transform: scale(0.99);
        }

        .playlist-item.is-current {
            color: var(--text);
            background: hsla(var(--accent-hue), 75%, 62%, 0.13);
        }

        .playlist-index {
            color: var(--text-dim);
            font-size: 9px;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        .playlist-item.is-current .playlist-index {
            color: var(--accent);
        }

        .playlist-art {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 8px;
            background: var(--cover-fallback);
        }

        .playlist-copy {
            min-width: 0;
        }

        .playlist-title,
        .playlist-artist {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .playlist-title {
            color: inherit;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.25;
        }

        .playlist-artist {
            margin-top: 2px;
            color: var(--text-dim);
            font-size: 11px;
            line-height: 1.2;
        }

        .playlist-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 10px;
            font-variant-numeric: tabular-nums;
        }

        .playlist-meta .icon-round {
            display: none;
            color: var(--accent);
            font-size: 16px;
        }

        .playlist-item.is-current .playlist-meta .icon-round {
            display: inline-block;
            transform-origin: center;
        }

        .is-playing .playlist-item.is-current .playlist-meta .icon-round {
            animation: current-track-pulse 850ms ease-in-out infinite alternate;
        }

        .playlist-empty {
            display: none;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 0;
            padding: 14px;
            color: var(--text-dim);
            font-size: 11px;
        }

        .playlist-panel.is-empty .playlist-empty {
            display: flex;
        }

        .playlist-panel.is-empty .playlist-list {
            display: none;
        }

        .playlist-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 0 0 26px;
            padding: 0 10px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 10px;
        }

        .preferences-panel {
            display: none;
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface-soft);
            flex-direction: column;
            gap: 10px;
            font-size: 12px;
            scrollbar-color: hsla(var(--accent-hue), 65%, 63%, 0.45) transparent;
            scrollbar-width: thin;
        }

        .is-preferences-open .preferences-panel { display: flex; }
        .preferences-head, .preference-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .preference-row small { display: block; margin-top: 4px; color: var(--text-dim); font-size: 11px; line-height: 1.4; }
        .preference-row input { width: 17px; height: 17px; accent-color: var(--accent); }
        .preference-row select { padding: 6px; border: 1px solid var(--border); border-radius: 7px; color: var(--text); background: var(--surface); font: inherit; }
        .preference-row select:focus-visible { outline: 1px solid var(--accent); }
        .preferences-note { margin-top: auto; color: var(--text-dim); font-size: 10px; line-height: 1.5; }

        .feedback { flex: 1; min-width: 0; overflow: hidden; color: var(--accent); text-overflow: ellipsis; white-space: nowrap; text-align: center; }

        .progress-section {
            position: relative;
            flex: 0 0 auto;
            margin: 0 2px;
            -webkit-app-region: no-drag;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            margin: 0 1px 4px;
            color: var(--text-dim);
            gap: 10px;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .music-progress-bar {
            position: relative;
            display: block;
            width: 100%;
            height: 24px;
            padding: 9px 0;
            border: 0;
            background: transparent;
            cursor: ew-resize;
            touch-action: none;
            outline: none;
            -webkit-app-region: no-drag;
        }

        .progress-track {
            position: relative;
            display: block;
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: var(--track);
            transition: height 160ms ease, background-color 160ms ease;
        }

        .progress-line {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent-strong), var(--accent));
            box-shadow: 0 0 6px hsla(var(--accent-hue), 90%, 65%, 0.2);
            transition: width 120ms linear;
        }

        .progress-thumb {
            position: absolute;
            top: 50%;
            left: 0;
            width: 11px;
            height: 11px;
            border: 2px solid var(--surface);
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 1px hsla(var(--accent-hue), 80%, 60%, 0.46), 0 2px 7px rgba(0, 0, 0, 0.28);
            transform: translate(-50%, -50%);
            transition: left 120ms linear, transform 120ms ease;
        }

        .music-progress-bar:hover .progress-track,
        .music-progress-bar.is-seeking .progress-track {
            height: 6px;
            background: hsla(var(--accent-hue), 55%, 62%, 0.22);
        }

        .music-progress-bar:hover .progress-thumb,
        .music-progress-bar.is-seeking .progress-thumb {
            transform: translate(-50%, -50%) scale(1.25);
            box-shadow: 0 0 0 3px hsla(var(--accent-hue), 85%, 65%, 0.18), 0 0 12px hsla(var(--accent-hue), 90%, 65%, 0.68);
        }

        .music-progress-bar:focus-visible {
            border-radius: 5px;
            box-shadow: 0 0 0 2px hsla(var(--accent-hue), 90%, 65%, 0.55);
        }

        .music-progress-bar.is-seeking .progress-line,
        .music-progress-bar.is-seeking .progress-thumb {
            transition: none;
        }

        .music-progress-bar[aria-disabled="true"] {
            cursor: default;
        }

        .progress-preview {
            position: absolute;
            bottom: calc(100% + 8px);
            left: clamp(24px, var(--seek-preview-position, 0%), calc(100% - 24px));
            min-width: 44px;
            padding: 4px 7px;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            background: var(--surface);
            box-shadow: 0 3px 12px var(--shadow);
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateX(-50%);
        }

        .progress-preview.is-visible {
            opacity: 1;
            visibility: visible;
        }

        @keyframes cover-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rhythm {
            from { transform: scaleY(0.55); opacity: 0.55; }
            to { transform: scaleY(1.15); opacity: 1; }
        }

        @keyframes sheen-breathe {
            0%, 100% { opacity: 0.42; }
            50% { opacity: 0.82; }
        }

        @keyframes lyric-arrive {
            from { opacity: 0.35; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes current-track-pulse {
            from { opacity: 0.62; transform: scaleY(0.72); }
            to { opacity: 1; transform: scaleY(1.12); }
        }

        @keyframes panel-in {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 64px), (max-height: 64px) {
            *, *::before, *::after { animation-play-state: paused !important; }
            .play-control > *, .play-control .track-details, .play-control .control { visibility: hidden !important; }
            .play-widget {
                padding: 0;
            }

            .play-control {
                border-radius: 0 12px 12px 0;
            }

            .play-control::before {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 3px;
                height: 36px;
                content: "";
                border-radius: 999px;
                background: var(--accent);
                transform: translate(-50%, -50%);
            }
        }

        @media (max-height: 64px) {
            .play-control { border-radius: 10px; }
            .play-control::before { width: 48px; height: 3px; }
        }
    </style>
</head>
<body>
    <main id="widgetRoot" class="play-widget" aria-label="播放控件，按 Tab 进入操作" tabindex="0">
        <section class="play-control">
            <div class="topline">
                <div class="cover" aria-hidden="true">
                    <img id="img" draggable="false" alt="专辑封面">
                    <span class="cover-sheen"></span>
                </div>

                <div class="track-info">
                  <div class="track-details">
                    <div class="track-kicker">
                        <span id="stateDot" class="state-dot"></span>
                        <span id="playState">READY</span>
                        <button id="lyricsRetry" class="text-action" type="button" hidden>重试歌词</button>
                        <span id="rhythmBars" class="rhythm-bars" aria-hidden="true">
                            <i></i><i></i><i></i><i></i>
                        </span>
                    </div>
                    <div id="trackName" class="track-name" title="暂无歌曲">暂无歌曲</div>
                    <div class="track-caption">
                    <div id="trackArtist" class="track-artist">等待播放</div>
                    <div id="trackAlbum" class="track-album">播放控件</div>
                    </div>
                  </div>
                    <div class="idle-lyric" aria-live="polite">
                        <span class="icon-round" aria-hidden="true">lyrics</span>
                        <span id="idleLyricText" class="idle-lyric-text">等待播放</span>
                    </div>
                </div>

                <div class="control" role="group" aria-label="播放控制">
                    <button id="queueBtn" class="icon-button" type="button" title="展开歌单" aria-label="展开歌单" aria-controls="playlistPanel" aria-expanded="false" aria-pressed="false">
                        <span class="fa fa-queue" aria-hidden="true"></span>
                    </button>
                    <button id="prevBtn" class="icon-button" type="button" title="上一首" aria-label="上一首">
                        <span class="fa fa-step-backward" aria-hidden="true"></span>
                    </button>
                    <button id="playBtn" class="icon-button icon-button-primary" type="button" title="播放" aria-label="播放">
                        <span class="fa fa-play" aria-hidden="true"></span>
                    </button>
                    <button id="nextBtn" class="icon-button" type="button" title="下一首" aria-label="下一首">
                        <span class="fa fa-step-forward" aria-hidden="true"></span>
                    </button>
                    <button id="expand" class="icon-button" type="button" title="显示主窗口" aria-label="显示主窗口">
                        <span class="fa fa-expand" aria-hidden="true"></span>
                    </button>
                    <button id="preferencesBtn" class="icon-button" type="button" title="控件偏好" aria-label="控件偏好" aria-controls="preferencesPanel" aria-expanded="false">
                        <span class="icon-round" aria-hidden="true">tune</span>
                    </button>
                </div>
            </div>

            <section id="playlistPanel" class="playlist-panel is-empty" aria-label="播放列表">
                <header class="playlist-head">
                    <strong>播放列表</strong>
                    <span id="playlistCount" class="playlist-count">0 首</span>
                    <button id="locateCurrent" class="icon-button" type="button" title="定位当前歌曲" aria-label="定位当前歌曲"><span class="icon-round" aria-hidden="true">my_location</span></button>
                    <button id="closePlaylist" class="icon-button" type="button" title="关闭歌单" aria-label="关闭歌单"><span class="icon-round" aria-hidden="true">close</span></button>
                </header>
                <div id="playlistList" class="playlist-list"></div>
                <div id="playlistEmpty" class="playlist-empty">当前没有可展示的歌单</div>
                <footer class="playlist-foot"><span id="playlistStatus" role="status">双击或按 Enter 播放</span><button id="playlistRetry" class="text-action" type="button" hidden>重试</button></footer>
            </section>

            <section id="preferencesPanel" class="preferences-panel" aria-label="控件偏好">
                <header class="preferences-head"><strong>控件偏好</strong><button id="closePreferences" class="icon-button" type="button" aria-label="关闭控件偏好" title="关闭"><span class="icon-round" aria-hidden="true">close</span></button></header>
                <label class="preference-row"><span>贴边时保持展开<small>靠近屏幕边缘也不自动收起</small></span><input id="keepExpanded" type="checkbox"></label>
                <label class="preference-row"><span>离开后收起<small>为短暂移出鼠标留出时间</small></span><select id="autoHideDelay" aria-label="离开后收起延时"><option value="450">快速 · 0.45 秒</option><option value="800">舒缓 · 0.8 秒</option><option value="1400">从容 · 1.4 秒</option></select></label>
                <div class="preference-row"><span>窗口位置<small>下次开启恢复当前位置</small></span><button id="resetPosition" class="text-action" type="button">回到主屏</button></div>
                <p class="preferences-note">偏好自动保存 · LUOLEYAN</p>
            </section>

            <div class="progress-section">
                <div class="time-row">
                    <span id="elapsed" aria-hidden="true">0:00</span>
                    <span id="feedback" class="feedback" role="status" aria-live="polite"></span>
                    <span id="duration" aria-hidden="true">0:00</span>
                </div>
                <button id="progressBar" class="music-progress-bar" type="button" role="slider" aria-label="调整播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                    <span id="progressPreview" class="progress-preview" aria-hidden="true">0:00</span>
                    <span class="progress-track">
                        <span id="progressFill" class="progress-line"></span>
                        <span class="progress-thumb"></span>
                    </span>
                </button>
            </div>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
