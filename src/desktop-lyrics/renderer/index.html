<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline';">
    <title>lyrics</title>
</head>
<body>
    <style>
        body {
            -webkit-app-region: drag;
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color, rgba(0, 0, 0, 0));
            backdrop-filter: var(--bg-blur, none);
            -webkit-backdrop-filter: var(--bg-blur, none);
        }

        body.locked .resize-handle {
            opacity: 0;
            pointer-events: none;
        }

        .lrc {
            color: aquamarine;
            font-weight: normal;
            font-size: 24px;
            -webkit-text-stroke-width: var(--stroke-width, 0.5px);
            -webkit-text-stroke-color: var(--stroke-color, #fff);
            filter: drop-shadow(
                0 0 var(--shadow-blur, 2px) var(--shadow-color, rgba(0, 0, 0, 0.8))
            );
            text-wrap: nowrap;
            width: fit-content;
            height: fit-content;
        }

        .container {
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: var(--text-align, center);
            gap: 4px;
            width: 100%;
            max-width: 100vw;
            height: fit-content;
            box-sizing: border-box;
            padding: 0 12px;
            transition: transform 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .resize-handle {
            -webkit-app-region: no-drag;
            position: fixed;
            right: 0;
            bottom: 0;
            width: 20px;
            height: 20px;
            z-index: 9999;
            cursor: se-resize;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        body:not(.locked) .resize-handle {
            opacity: 0.3;
            pointer-events: auto;
        }

        body:not(.locked) .resize-handle:hover {
            opacity: 0.7;
            background: linear-gradient(135deg, transparent 50%, rgba(255, 255, 255, 0.35) 50%);
        }

        .resize-handle.resizing {
            opacity: 1 !important;
        }

        .container.dual-line > :last-child {
            align-self: inherit;
        }

        .lrc-line {
            display: flex;
            flex-direction: column;
            align-items: var(--text-align, center);
            gap: 2px;
            width: 100%;
            max-width: 100%;
            transition:
                transform 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                opacity 0.24s ease,
                scale 0.16s ease-in-out;
            will-change: transform, opacity;
        }

        .container.multi-animating {
            transform: translateY(var(--multi-shift, 0px));
        }

        .lrc-line.entering {
            opacity: 0.45;
            transform: translateY(14px);
        }

        .lrc-line.leaving {
            opacity: 0.45;
            transform: translateY(-14px);
        }

        .lrc.romaji {
            order: 1;
        }

        .lrc:not(.romaji):not(.translation) {
            order: 2;
        }

        .lrc.translation {
            order: 3;
        }

        .lrc-viewport {
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            box-sizing: border-box;
        }

        .lrc-viewport .lrc {
            width: fit-content;
            min-width: 0;
        }

        .lrc-viewport.scroll-karaoke {
            display: block;
        }

        .lrc-viewport.scroll-karaoke:not(.is-overflow) {
            display: flex;
            justify-content: var(--text-justify, center);
        }

        .lrc-viewport.scroll-karaoke.is-overflow .lrc {
            transform: translateX(var(--scroll-x, 0px));
            will-change: transform;
        }

        .lrc-viewport.fit-static {
            display: flex;
            justify-content: var(--text-justify, center);
            align-items: center;
        }

        .lrc-viewport.fit-static .lrc {
            transform: scale(var(--fit-scale, 1));
            transform-origin: var(--text-origin, center) center;
        }

        .lrc-line.past {
            opacity: 0.4;
            scale: 0.85;
        }

        .lrc-line.current {
            opacity: 1;
            scale: 1.1;
        }

        .lrc-line.future {
            opacity: 0.6;
            scale: 0.92;
        }

        .lrc-line .lrc.focus {
            color: gold;
            scale: 1.1;
        }

        .lrc.romaji {
            font-size: 0.65em;
            font-weight: normal;
            opacity: 0.55;
            scale: 1;
            -webkit-text-stroke: 0.3px #fff;
        }

        .lrc.romaji.focus {
            opacity: 0.75;
            scale: 1;
        }

        .lrc.romaji:empty {
            display: none;
        }

        .lrc.translation {
            font-weight: normal;
            opacity: 0.85;
            scale: 1;
            -webkit-text-stroke: 0.35px #fff;
        }

        .lrc.translation:not(.focus) {
            opacity: 0.65;
        }

        .lrc.translation:empty {
            display: none;
        }
        .lrc.karaoke-line {
            --lrc-current: gold;
            --lrc-next: aquamarine;
        }

        .lrc .word {
            display: inline-block;
            will-change: opacity, transform, filter;
            color: color-mix(
                in srgb,
                var(--lrc-next) calc((1 - var(--p, 0)) * 100%),
                var(--lrc-current)
            );
            opacity: calc(0.36 + 0.64 * var(--p, 0));
            transform: scale(calc(0.96 + 0.08 * var(--p, 0)));
            filter: drop-shadow(0 0 calc(1px + 8px * var(--p, 0)) var(--lrc-current));
        }
    </style>
    <div class="container" id="container"></div>
    <div class="resize-handle" id="resizeHandle"></div>
    <script src="./index.ts"></script>
</body>
</html>
